<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orq · living map</title>
<!--
  docs/map.html — the living map of the orq skill (lane T51, 2026-09-25).
  A single file, no libraries or network: it opens with a double click from disk.
  Level 0 = the drawing of docs/cover.svg copied as is (cover.svg is NOT touched: it is the README's fixed cover).
  Level 1 = clicking a piece shows its real connections, with the repo's names.
  Level 2 = the BIG lane: its lead in a named terminal and the mini-orchestrator (STEPS A-D).
  Owner's cap (09-16): at most 12 boxes visible at once and 8 words per box.
  The names are watched by tests/test-structure.mjs, section T51.
-->
<style>
  :root {
    --lamina: #0B1220; --borde: #64748B; --texto: #F1F5F9; --suave: #B8C5D9; --gris: #94A3B8;
    --owner: #F9A8D4; --orq: #60A5FA; --hook: #FBBF24; --lane: #94A3B8; --master: #C4B5FD;
    --p1: #60A5FA; --p2: #38BDF8; --p3: #22D3EE; --p4: #2DD4BF; --p5: #5EEAD4;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #070C16; color: var(--texto); font-family: var(--sans); }
  body { min-height: 100vh; padding: 20px 16px 40px; }
  .marco { max-width: 1240px; margin: 0 auto; }
  header.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 16px; }
  header.barra h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  header.barra h1 span { color: var(--suave); font-weight: 400; letter-spacing: 0; }
  .miga { color: var(--suave); font-size: 16px; }
  .miga b { color: var(--texto); font-weight: 600; }
  .pista { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid rgba(249,168,212,.55); background: rgba(249,168,212,.08); color: var(--owner); font-weight: 600; font-size: 16px; }
  .pista[hidden], button[hidden] { display: none; }
  button.volver { margin-left: auto; font: 600 16px var(--sans); color: var(--texto); background: linear-gradient(#1C2B43,#121D30);
    border: 1.5px solid var(--borde); border-radius: 12px; padding: 9px 16px; cursor: pointer; min-height: 44px; }
  button.volver:hover { border-color: var(--orq); }
  button:focus-visible { outline: 3px solid var(--orq); outline-offset: 3px; }

  /* level 0: the cover, as is, with a click layer on top */
  #nivel0 svg { display: block; width: 100%; height: auto; }
  .hit { fill: #FFFFFF; fill-opacity: 0; stroke: none; cursor: pointer; }
  .hit:hover, .hit:focus-visible { fill-opacity: .04; stroke: var(--c, #60A5FA); stroke-width: 3; }
  .hit:focus { outline: none; }
  .ayuda0 { color: var(--suave); font-size: 15px; margin: 10px 4px 0; }

  /* level 1 and 2: the same boxes as the cover (surface, bevel, shadow, colored border) */
  #vista { border: 1.5px solid var(--borde); border-radius: 24px; background:
      radial-gradient(ellipse at 50% 0%, rgba(37,99,235,.12), rgba(37,99,235,0) 60%), var(--lamina);
    padding: 28px 24px 24px; }
  #vista:focus-visible { outline: 2px solid var(--c, var(--orq)); outline-offset: 4px; }
  .nivel { font-size: 14px; font-weight: 600; letter-spacing: 2px; color: var(--suave); text-transform: uppercase; margin: 0 0 14px; }
  .caja { position: relative; background: linear-gradient(#1C2B43, #121D30); border: 1.5px solid color-mix(in srgb, var(--c) 60%, transparent);
    border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.14); padding: 12px 16px; min-width: 150px; }
  .caja .tag { display: block; font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--c); margin-bottom: 4px; word-break: break-word; }
  .caja .txt { display: block; font-size: 17px; font-weight: 500; color: var(--texto); line-height: 1.3; }
  .caja.cabeza { border-width: 2px; padding: 16px 22px; display: inline-block; }
  .caja.cabeza .tit { display: block; margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 3px; color: var(--texto); }
  .caja.cabeza .txt { color: var(--suave); font-weight: 400; font-size: 18px; margin-top: 4px; }
  .fila { display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px; }
  .fila.flujo { gap: 12px 0; }
  .paso { display: flex; align-items: stretch; gap: 12px; flex: 0 1 auto; }
  .paso:not(:first-child) { margin-left: 12px; }
  .fila.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .flecha { align-self: center; color: var(--c); font-size: 20px; font-weight: 700; }
  .rotulo { margin: 18px 0 10px; font-size: 16px; font-weight: 600; color: var(--c); }
  .nota { margin-top: 22px; padding-top: 14px; border-top: 1px dashed rgba(148,163,184,.35); color: var(--suave); font-size: 15px; line-height: 1.55; }
  .nota p { margin: 0 0 6px; }
  .nota code { font-family: var(--mono); font-size: 13.5px; color: var(--texto); background: rgba(148,163,184,.1); padding: 1px 5px; border-radius: 5px; word-break: break-word; }
  .caja-enlace { display: inline-block; margin-top: 16px; font: 600 16px var(--sans); color: var(--texto); background: transparent;
    border: 1.5px dashed var(--c); border-radius: 12px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) { #vista:not([hidden]) { animation: entra .18s ease-out; } }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 980px) { .caja.cabeza .tit { font-size: 22px; } #vista { padding: 20px 16px; } }
</style>
</head>
<body>
<div class="marco">
  <header class="barra">
    <h1>orq <span>· living map</span></h1>
    <span class="miga" id="miga"><b>level 0</b> · the whole circuit</span>
    <span class="pista" id="pista">click on a piece</span>
    <button class="volver" id="volver" type="button" hidden>← back to the map</button>
  </header>

  <main>
    <div id="nivel0">
      <h2 class="sr">level 0 · the whole circuit</h2>
      <svg viewBox="0 0 1200 960" role="group" aria-labelledby="t" aria-describedby="d">
  <title id="t">orq: the orchestration circuit</title>
  <desc id="d">The owner invokes the skill and decides. The orchestrator does not build: it dispatches briefs to three lanes, each in its own worktree, and verifies the receipts that come up. The hook watches every lane and warns the orchestrator. Only the orchestrator, with a permit, merges to master. Below, the life of a lane in five steps: brief, builds, 4 suites, Codex review, receipt.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .h1 { font-size: 26px; font-weight: 700; fill: #F1F5F9; letter-spacing: 3px; }
    .h2 { font-size: 26px; font-weight: 600; fill: #F1F5F9; }
    .h3 { font-size: 22px; font-weight: 600; fill: #F1F5F9; }
    .t1 { font-size: 18px; font-weight: 500; fill: #F1F5F9; }
    .t2 { font-size: 18px; font-weight: 400; fill: #B8C5D9; }
    .sub { font-size: 20px; font-weight: 400; fill: #B8C5D9; }
    .lbl { font-size: 18px; font-weight: 600; }
    .cap { font-size: 16px; font-weight: 600; fill: #B8C5D9; letter-spacing: 2px; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>

  <defs>
    <!-- surfaces -->
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2B43"/>
      <stop offset="1" stop-color="#121D30"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="600" cy="246" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- arrowheads, one per wire -->
    <marker id="aEnc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#60A5FA"/>
    </marker>
    <marker id="aRec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#5EEAD4"/>
    </marker>
    <marker id="aAvi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#FBBF24"/>
    </marker>
    <marker id="aMer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#C4B5FD"/>
    </marker>
    <marker id="aEsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#F9A8D4"/>
    </marker>
    <marker id="aStep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#64748B"/>
    </marker>

    <!-- pulse paths -->
    <path id="pEnc1" d="M544 304V380H198Q184 380 184 394V450"/>
    <path id="pEnc2" d="M544 304V450"/>
    <path id="pEnc3" d="M544 304V380H890Q904 380 904 394V450"/>
    <path id="pRec3" d="M1016 450V362Q1016 348 1002 348H656V304"/>
  </defs>
  <g aria-hidden="true">

  <!-- ============ LAYER 0: sheet, grid, halo ============ -->
  <rect x="0.75" y="0.75" width="1198.5" height="958.5" rx="24" fill="#0B1220" stroke="#64748B" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="1198.5" height="958.5" rx="24" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="958.5" rx="24" fill="url(#halo)"/>

  <!-- ============ LAYER 1: wires ============ -->
  <!-- watches every lane (fine dotted line; passes underneath the others) -->
  <g fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round">
    <path d="M1152 256H1156Q1170 256 1170 270V404Q1170 418 1156 418H254Q240 418 240 432V446"/>
    <path d="M600 418V446"/>
    <path d="M960 418V446"/>
  </g>
  <g fill="#94A3B8">
    <circle cx="600" cy="418" r="3.5"/>
    <circle cx="960" cy="418" r="3.5"/>
  </g>

  <!-- shims: the background color under each main wire cuts the dotted line where they cross -->
  <g fill="none" stroke="#0B1220" stroke-width="11">
    <path d="M544 304V450"/>
    <path d="M544 380H198Q184 380 184 394V450M544 380H890Q904 380 904 394V450"/>
    <path d="M656 450V304M296 450V362Q296 348 310 348H656M1016 450V362Q1016 348 1002 348H656"/>
  </g>

  <!-- the owner invokes the skill -->
  <path d="M600 124V188" fill="none" stroke="#F9A8D4" stroke-width="3" marker-end="url(#aEsm)"/>

  <!-- briefs go down: the bus toward T1 and T3 -->
  <g fill="none" stroke="#60A5FA" stroke-width="3">
    <path d="M544 380H198Q184 380 184 394V450" marker-end="url(#aEnc)"/>
    <path d="M544 380H890Q904 380 904 394V450" marker-end="url(#aEnc)"/>
  </g>

  <!-- receipts go up (they hop over the briefs bus with a bridge) -->
  <g fill="none" stroke="#0B1220" stroke-width="8">
    <path d="M296 386A6 6 0 0 1 296 374"/>
    <path d="M656 386A6 6 0 0 1 656 374"/>
  </g>
  <g fill="none" stroke="#5EEAD4" stroke-width="3">
    <path d="M656 450V386A6 6 0 0 1 656 374V304" marker-end="url(#aRec)"/>
    <path d="M296 450V386A6 6 0 0 1 296 374V362Q296 348 310 348H656"/>
    <path d="M1016 450V362Q1016 348 1002 348H656"/>
  </g>
  <circle cx="656" cy="348" r="4.5" fill="#5EEAD4"/>

  <!-- briefs trunk (hops over the receipts bus) -->
  <path d="M544 342A6 6 0 0 1 544 354" fill="none" stroke="#0B1220" stroke-width="8"/>
  <path d="M544 304V342A6 6 0 0 1 544 354V450" fill="none" stroke="#60A5FA" stroke-width="3" marker-end="url(#aEnc)"/>
  <circle cx="544" cy="380" r="4.5" fill="#60A5FA"/>

  <!-- hook alerts -->
  <path d="M900 246H802" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#aAvi)"/>

  <!-- merge: only the orchestrator, with a permit -->
  <g fill="none" stroke="#C4B5FD" stroke-width="4">
    <path d="M240 600V640Q240 654 254 654H600"/>
    <path d="M960 600V640Q960 654 946 654H600"/>
    <path d="M600 600V709" marker-end="url(#aMer)"/>
  </g>
  <circle cx="600" cy="654" r="5" fill="#C4B5FD"/>
  <rect x="594" y="674" width="12" height="12" transform="rotate(45 600 680)" fill="#0B1220" stroke="#C4B5FD" stroke-width="2.5"/>

  <!-- ============ LAYER 2: pulses (SMIL animation) ============ -->
  <g class="motion">
    <g opacity="0">
      <circle r="9" fill="#60A5FA" opacity="0.3" filter="url(#glow)"/>
      <circle r="4" fill="#BFDBFE"/>
      <animateMotion dur="6s" repeatCount="indefinite" begin="0s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1"><mpath xlink:href="#pEnc1"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="0s" values="0;1;1;0;0" keyTimes="0;0.07;0.64;0.7;1"/>
    </g>
    <g opacity="0">
      <circle r="9" fill="#60A5FA" opacity="0.3" filter="url(#glow)"/>
      <circle r="4" fill="#BFDBFE"/>
      <animateMotion dur="6s" repeatCount="indefinite" begin="2s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.25;1"><mpath xlink:href="#pEnc2"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="2s" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1"/>
    </g>
    <g opacity="0">
      <circle r="9" fill="#60A5FA" opacity="0.3" filter="url(#glow)"/>
      <circle r="4" fill="#BFDBFE"/>
      <animateMotion dur="6s" repeatCount="indefinite" begin="4s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1"><mpath xlink:href="#pEnc3"/></animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="4s" values="0;1;1;0;0" keyTimes="0;0.07;0.64;0.7;1"/>
    </g>
    <g opacity="0">
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="#5EEAD4" opacity="0.3" filter="url(#glow)"/>
      <rect x="-4" y="-4" width="8" height="8" transform="rotate(45)" fill="#CCFBF1"/>
      <animateMotion dur="7s" repeatCount="indefinite" begin="1.2s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.6;1"><mpath xlink:href="#pRec3"/></animateMotion>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" begin="1.2s" values="0;1;1;0;0" keyTimes="0;0.06;0.55;0.6;1"/>
    </g>
  </g>

  <!-- ============ LAYER 3: boxes ============ -->
  <!-- owner -->
  <g filter="url(#shadow)">
    <rect x="370" y="40" width="460" height="84" rx="16" fill="url(#surf)" stroke="#64748B" stroke-opacity="0.65" stroke-width="1.5"/>
  </g>
  <rect x="371.5" y="41.5" width="457" height="81" rx="15" fill="none" stroke="url(#bevel)" stroke-width="1"/>
  <circle cx="414" cy="82" r="22" fill="#F9A8D4" fill-opacity="0.14" stroke="#F9A8D4" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="414" cy="76" r="6.5" fill="none" stroke="#F9A8D4" stroke-width="2.2"/>
  <path d="M402 95Q402 84 414 84Q426 84 426 95" fill="none" stroke="#F9A8D4" stroke-width="2.2" stroke-linecap="round"/>
  <text x="450" y="75" class="sans h2">Owner</text>
  <text x="450" y="104" class="sans t2">decides · gives permits · reads receipts</text>

  <!-- label of the owner → orchestrator wire -->
  <rect x="614" y="140" width="66" height="30" rx="15" fill="#0B1220" stroke="#F9A8D4" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="647" y="161" text-anchor="middle" class="mono lbl" fill="#F9A8D4">/orq</text>

  <!-- ORCHESTRATOR -->
  <g filter="url(#shadow)">
    <rect x="400" y="188" width="400" height="116" rx="20" fill="url(#surf)" stroke="#60A5FA" stroke-opacity="0.85" stroke-width="2"/>
  </g>
  <rect x="401.5" y="189.5" width="397" height="113" rx="19" fill="none" stroke="url(#bevel)" stroke-width="1"/>
  <text x="600" y="240" text-anchor="middle" class="sans h1">ORCHESTRATOR</text>
  <text x="600" y="274" text-anchor="middle" class="sans sub">never builds · verifies · dispatches</text>
  <!-- ports -->
  <circle cx="544" cy="304" r="4.5" fill="#0B1220" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="656" cy="304" r="4.5" fill="#0B1220" stroke="#5EEAD4" stroke-width="2"/>
  <circle cx="800" cy="246" r="4.5" fill="#0B1220" stroke="#FBBF24" stroke-width="2"/>

  <!-- labels for briefs, receipts and alerts -->
  <text x="530" y="336" text-anchor="end" class="sans lbl" fill="#60A5FA">briefs ↓</text>
  <text x="670" y="336" class="sans lbl" fill="#5EEAD4">↑ receipts</text>
  <text x="851" y="233" text-anchor="middle" class="sans lbl" fill="#FBBF24">alerts</text>

  <!-- HOOK -->
  <g filter="url(#shadow)">
    <rect x="900" y="188" width="252" height="136" rx="16" fill="url(#surf)" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>
  <rect x="901.5" y="189.5" width="249" height="133" rx="15" fill="none" stroke="url(#bevel)" stroke-width="1"/>
  <circle cx="940" cy="226" r="18" fill="#FBBF24" fill-opacity="0.12"/>
  <path d="M927 226H933L936 218L941 234L945 222L947 226H953" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="motion" cx="940" cy="226" r="18" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="5s" repeatCount="indefinite" values="18;30;30" keyTimes="0;0.16;1" calcMode="spline" keySplines="0.22 0.61 0.36 1;0 0 1 1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0.55;0;0" keyTimes="0;0.16;1" calcMode="spline" keySplines="0.22 0.61 0.36 1;0 0 1 1"/>
  </circle>
  <text x="970" y="235" class="sans h2">HOOK</text>
  <text x="924" y="276" class="sans t2">ledger · gates</text>
  <text x="924" y="302" class="sans t2">pulse · handoff</text>
  <circle cx="1152" cy="256" r="4" fill="#0B1220" stroke="#94A3B8" stroke-width="2"/>

  <!-- label of the watching -->
  <text x="1158" y="382" text-anchor="end" class="sans lbl" fill="#B8C5D9">watches</text>
  <text x="1158" y="404" text-anchor="end" class="sans lbl" fill="#B8C5D9">every lane</text>

  <!-- LANES -->
  <g id="carril1">
    <g filter="url(#shadow)">
      <rect x="80" y="450" width="320" height="150" rx="16" fill="url(#surf)" stroke="#64748B" stroke-opacity="0.65" stroke-width="1.5"/>
    </g>
    <rect x="81.5" y="451.5" width="317" height="147" rx="15" fill="none" stroke="url(#bevel)" stroke-width="1"/>
    <rect x="104" y="472" width="30" height="24" rx="5" fill="none" stroke="#B8C5D9" stroke-width="1.8"/>
    <path d="M110 480L115 484L110 488M118 489H126" fill="none" stroke="#B8C5D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="146" y="492" class="sans h3">lane T1</text>
    <g fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round">
      <circle cx="110" cy="506" r="3"/><circle cx="110" cy="524" r="3"/><circle cx="124" cy="512" r="3"/>
      <path d="M110 509V521M124 515Q124 521 113 523"/>
    </g>
    <text x="136" y="522" class="sans t2">own worktree</text>
    <rect x="104" y="542" width="50" height="8" rx="4" fill="#60A5FA"/>
    <rect x="159.5" y="542" width="50" height="8" rx="4" fill="#38BDF8"/>
    <rect x="215" y="542" width="50" height="8" rx="4" fill="#334155"/>

}
function abrir(id, desde) {
  var v = VISTAS[id];
  if (!v) return;
  if (desde) origen = desde;
  vista.innerHTML = '';
  vista.style.setProperty('--c', v.c);
  vista.dataset.pieza = id;
  vista.dataset.nivel = String(v.nivel);
  vista.appendChild(el('p', 'nivel', v.nivel === 2 ? 'level 2 · BIG lane from the inside' : 'level 1 · its real connections'));
  var cab = el('div', 'caja cabeza');
  cab.style.setProperty('--c', v.c);
  var tit = el('h2', 'tit', v.titulo);
  tit.id = 'vista-titulo';
  cab.appendChild(tit);
  cab.appendChild(el('span', 'txt', v.sub));
  vista.appendChild(cab);
  v.filas.forEach(function (f) {
    var cf = f.c || v.c;
    var r = el('p', 'rotulo', f.rotulo);
    r.style.setProperty('--c', cf);
    vista.appendChild(r);
    var fila = el('div', 'fila ' + f.tipo);
    fila.style.setProperty('--c', cf);
    f.cajas.forEach(function (d, i) {
      // in a flow, the arrow sticks to the box that comes after it: when the row breaks
      // (900 px) a stray arrow is never left at the end of a line (Codex T51-r1)
      var destino = fila;
      if (f.tipo === 'flujo') {
        destino = el('div', 'paso');
        if (i > 0) {
          var fl = el('span', 'flecha', '→');
          fl.setAttribute('aria-hidden', 'true');
          fl.style.setProperty('--c', d.c || cf);
          destino.appendChild(fl);
        }
        fila.appendChild(destino);
      }
      destino.appendChild(caja(d, cf));
    });
    vista.appendChild(fila);
  });
  if (v.enlace) {
    var b = el('button', 'caja-enlace', v.enlace.txt);
    b.type = 'button';
    b.style.setProperty('--c', 'var(--p2)');
    b.addEventListener('click', function () { abrir(v.enlace.a); });
    vista.appendChild(b);
  }
  var nota = el('div', 'nota');
  v.nota.forEach(function (h) { var p = el('p'); p.innerHTML = h; nota.appendChild(p); });
  vista.appendChild(nota);
  nivel0.hidden = true;
  vista.hidden = false;
  volver.hidden = false;
  pista.hidden = true;
  miga.innerHTML = '';
  miga.appendChild(el('b', null, 'level ' + v.nivel));
  miga.appendChild(document.createTextNode(' · ' + v.titulo));
  anuncio.textContent = 'Opened: ' + v.titulo + ', level ' + v.nivel + '. Escape returns to the map.';
  vista.focus();
  window.scrollTo(0, 0);
}
function cerrar() {
  if (vista.hidden) return;
  vista.hidden = true;
  vista.innerHTML = '';
  nivel0.hidden = false;
  volver.hidden = true;
  pista.hidden = false;
  miga.innerHTML = '<b>level 0</b> · the whole circuit';
  anuncio.textContent = 'Back on the map.';
  if (origen) origen.focus();
}
Array.prototype.forEach.call(document.querySelectorAll('.hit'), function (h) {
  h.addEventListener('click', function () { abrir(h.dataset.pieza, h); });
  h.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(h.dataset.pieza, h); }
  });
});
volver.addEventListener('click', cerrar);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrar(); });
</script>
</body>
</html>
